[project]
name = "megascans-browser-backend"
version = "0.1.0"
description = "Local API server for Megascans Browser"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pillow",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/megascans_browser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 実際にサーバープロセスを起動するテスト"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
